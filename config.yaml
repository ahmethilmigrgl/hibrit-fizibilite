    value:
      model: "fsa"
      fsa: {fiyat_usd_kw_yil: 20.0, aralik_usd_kw_yil: [14.0, 29.0], kullanilabilirlik_garantisi: 0.97}
      sahip_kalemleri_usd_kw_yil: {bop_bakimi: 5.0, yol_ve_saha: 1.5, scada_haberlesme: 1.0, varlik_yonetimi: 3.5, saha_personeli: 1.0, diger_beklenmeyen: 2.0}
