    birim: "oran [1/türbin/yıl], saat, €, $, gün, m/s"
    kaynak: >-
      Alt sistem arıza ORANLARI (toplam): kara RES'leri için WMEP (ISET/Fraunhofer IWES, 1.500 türbin, 1989–2006; Hahn, Durstewitz & Rohrig 2007,
      'Reliability of wind turbines', Wind Energy Springer) alt sistem yıllık arıza sıklıkları — grafikten okunan YAKLAŞIK değerler (elektrik ~0,57,
      kontrol ~0,43, sensör ~0,25, hidrolik ~0,23, yaw ~0,18, göbek ~0,17, fren ~0,13, kanat ~0,11, dişli ~0,10, jeneratör ~0,10, yapı ~0,09, aktarma ~0,05;
      toplam ≈ 2,4 = Faulstich vd. 2009 'Reliability of offshore turbines – identifying risks by onshore experience' (EWEC) Tablo 2'deki WMEP ortalaması 2,4;
      kara veritabanları aralığı 0,8–2,4 arıza/türbin/yıl, yıllık duruş 27–237 saat). Jeneratör ve güç elektroniği kara oranları ve sınıf kırılımı:
      Carroll, McDonald & McMillan 2016 (Wind Energy 19:1107–1119) Şekil 11–12 (kara: jeneratör 0,091/0,030/0,002; konvertör 0,069/0,037/0,001).
      İş SÜRELERİ, MALZEME MALİYETLERİ: Carroll vd. 2016 Şekil 13–14 (açık deniz, alt sistem × sınıf; iş süresi teknisyenin türbindeki süresi, lojistik
      ve hava beklemesi hariç). Sıfırlama: Carroll vd. 2016 Tablo 1 (manuel sıfırlama 7,5/yıl, 3 saat). TAHMİN olanlar: büyük değişim oranlarının
      bölünmesi (dişli 0,015, jeneratör 0,006, ana yatak 0,006, kanat 0,005 — Carroll açık deniz değişim oranlarının (0,154 / 0,095) kara için
      yaklaşık onda biri, jeneratörde Carroll kara 0,002 ile WMEP arası), Weibull şekil parametreleri (aşınma tipi > 1), ana yatak süre/maliyeti,
      tedarik süreleri, lojistik süreler, ekip büyüklüğü (her 7 türbine bir 2 kişilik ekip), hava sınırları (İSG/OEM tipik: kule/nasel çalışması ~15 m/s, ana bileşen kaldırma 8–10 m/s), ekip, ücret,
      önleyici bakım etkisi, CMS tespit olasılıkları ve P-F aralığı, vinç maliyeti, stok tutma oranı (sermaye %7 + depolama/sigorta/eskime %8),
      genel gider çarpanı ve diğer sabit giderler. v3 Ö1: genel gider çarpanı (1,30) ve diğer sabit giderler (12.000 $/MW-yıl) kaldırıldı (1,0 / 0);
      organizasyon ve sahip kalemleri v3.isletme'de kaynaklı olarak ayrıştırıldı. DES gideri artık yalnız türbin bakımının kendi yapılması durumundaki maliyeti
    not: >-
      Ölçek: değişim süreci Weibull(β, η) yenileme süreci; η, ömür boyu beklenen değişim sayısı (yenileme fonksiyonu) M(T) = λ·T olacak şekilde
      sayısal bulunur (aşınmada değişimler geç yıllara yığılır). Strateji: 'duzeltici' (yalnız arızada; küçük/büyük onarım oranları × 1,4, Weibull ölçeği × 0,8), 'takvim' (yılda bir
      önleyici bakım, temel oranlar), 'durum' (takvim + CMS: aktarma organı değişimleri P-F aralığında tespit edilir, planlı yapılır). İşletme gideri =
      (sabit ekip + düzeltici malzeme + vinç + önleyici malzeme + CMS + stok tutma) × genel gider çarpanı + diğer sabit giderler (saha yönetimi, BOP bakımı,
      SCADA, güvenlik, yol/arazi bakımı; TEİAŞ, sigorta ve arazi kirası finansal modelde ayrı). v1 OPEX 35.000 $/MW-yıl ile karşılaştırma docs/v3_D §6.
      tekrar: çevrimdışı analiz; tekrar_motor: tam analizde (≤ 30 s ek)
