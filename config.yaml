    birim: "$/kW-yıl (reel 2026 $); oran; $/yıl"
    kaynak: >-
      FSA fiyatı: Deutsche WindGuard (2024) 'Kostensituation der Windenergie an Land', Abb. 10: bakım ve onarım (çoğunlukla üreticiyle tam bakım
      sözleşmesi; büyük bileşenler ve kullanılabilirlik garantisi dahil) 1. on yıl 13, 2. on yıl 17 €/kW-yıl (58 proje, 1,2 GW) ≈ 14–18 $/kW-yıl;
      Wiser vd. (2019, LBNL) 'Benchmarking wind power operating costs': türbin O&M (planlı + plansız) 14–28 $/kW-yıl (ort. 20, 2017 $); top agrar
      haberine göre 3 MW türbinde tam bakım sözleşmesi yılda 80.000 €'ya kadar (≈ 29 $/kW). Merkez 20, aralık 14–29 $/kW-yıl. Kullanılabilirlik
      garantisi %97 (zaman bazlı): LBNL anketinde tam kapsamlı sözleşmelerin '%97'nin üzerinde kullanılabilirlik' sağladığı ve garanti altına
      düşüşün tazminatla karşılandığı belirtiliyor; DWG: Vollwartungsverträge 'Verfügbarkeitsgarantien' içerir. Sahip kalemleri: LBNL Şekil 5
      örnek kırılımları — BOP O&M 5,0 ve 7,9; varlık yönetimi 2,2–2,6; O&M tesisleri 2,0; beklenmeyen 0,4 $/kW-yıl; DWG: işletme ve genel
      yönetim (teknik + ticari işletme, SCADA izleme dahil) 4–5 €/kW-yıl, diğer 6–7 €/kW-yıl. Değerler bu aralıklardan TAHMİN olarak seçildi
      (BOP 5, yol/saha 1,5, SCADA/haberleşme 1, varlık yönetimi 3,5, sahibin saha personeli 1, beklenmeyen 2). Kendi bakımı: Briggs (2017) %30 ve
      IHS Markit (2018) %19 türbin O&M tasarrufu (LBNL'de aktarılıyor); organizasyon sabit gideri ve parça primi TAHMİN (bakım müdürü, 2
      mühendis, depo, araçlar, eğitim, 7/24 izleme ≈ 0,6 M$/yıl; üretici dışı parça tedarikinde %15 prim)
    not: >-
      Lazard LCOE+ 2025'in kara RES sabit O&M'i (24,5–40 $/kW-yıl, 300 MW referans) kalem kırılımı vermez; ABD pratiğinde arazi kirası, emlak
      vergisi ve sigortayı da içeren 'her şey dahil' işletme gideridir (LBNL: her şey dahil 33–59 $/kW-yıl örnekleri). v1 bu bandın üstünden
      35.000 $/MW-yıl alıp ayrıca sigorta (%0,35 CAPEX ≈ 4.000 $/MW-yıl) ve arazi kirası (1.500) ekliyordu → sigorta ve arazide kısmi çift sayım
      olasılığı. v3 Ö1: işletme gideri = FSA + sahip kalemleri (34 $/kW-yıl), sigorta/arazi/TEİAŞ/söküm ayrı. Tek sahalı 10–15 türbinlik
      projede varsayılan FSA (gerekçe docs/v3_E §0.1); kendi bakımının başabaş filo büyüklüğü outputs/v3E/E0_isletme_basabas.csv (Faz F girdisi)
