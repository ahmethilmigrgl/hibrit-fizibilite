      SPC: Montgomery (2019) 'Introduction to Statistical Quality Control' — EWMA λ = 0,05–0,25 küçük kaymalar için, CUSUM k =
      kaydırılacak büyüklüğün yarısı (1σ kayma → k = 0,5); parametreler hedef ARL0'a göre seçilir. İzleme birimi AY: haftalık
      model/gözlem oranının doğal gürültüsü ~%17–19 (ERA5 hücresinin sahaya özgü hava hatası; akranla birleşim yalnız ~%8 azaltıyor),
      aylık ~%10 (outputs/v3F/F4_gurultu.csv). ARL0 = 48 ay (santral başına yanlış alarm yaklaşık 4 yılda bir; 90 santrallik filoda
      ayda ~2) TAHMİN. Taban dönem 24 ay. Akran yarıçapı 100 km ve bölgesel düşüş eşikleri TAHMİN. Kalıcı sapma: son 6 ayın ≥ 3'ünde
      EWMA alarmı ve ortalama açık ≥ %3
    not: >-
      Santral adları varsayılan olarak GÖSTERİLMEZ (santral_adlari_goster: false): sonuçlar bir modelden türetilmiştir (ERA5 + atlas
      kalibrasyonu + akran karşılaştırması); kalıcı sapmanın nedeni model hatası, kesinti, planlı bakım, veri sorunu ya da gerçek
