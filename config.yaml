# v3 — Endüstri mühendisliği eklentileri (dal v3-ie). Faz D: türbin yerleşimi + bakım ve güvenilirlik.
# =====================================================================
v3:
  kayip:
    value:
      lumped_v2: 0.12
      kalibrasyon_kullanilabilirligi: 0.99
      iz_referansi: 0.051
      elektrik_diger: 0.03
      tablo: {elektrik: 0.020, turbin_performansi: 0.020, cevre_kirlenme_erozyon: 0.010, cevre_sicaklik_yildirim: 0.005, cevre_buzlanma: 0.002}
    birim: "oran"
    kaynak: "iz_referansi: atlas santrallerinin hesaplanan ortalama iz kaybı (85 santral, kendi OSM yerleşimi + komşular, PyWake Bastankhah; data/atlas/santral_iz_kaybi.csv, src/v3_D1_atlas_iz.py). kalibrasyon_kullanilabilirligi: D2 ayrık olay simülasyonunda yalnız < 48 saatlik duruşlardan kaynaklanan enerji kullanılabilirliği (Ezine, 14 türbin, üç stratejide 0,990–0,992; atlas kalibrasyonu ≥ 48 saatlik duruşları dışarıda bırakır). elektrik_diger TAHMİN (IEC 61400-15 kayıp sınıflaması: elektrik %1,5–3 + performans ~%1) — yalnız bilgi amaçlı"
    tablo_kaynak: "Lee & Fields (2021) 'An overview of wind-energy-production prediction bias, losses, and uncertainties', Wind Energ. Sci. 6:311–365, Tablo B (IEC 61400-15 kategorileri): elektrik toplam 2,1 (AWS Truepower 2014, Kuzey Amerika kara tipik), 1,2 (Mortensen 2013, KB Avrupa kara) → %2,0; türbin performansı 'generic' 2,4 (AWS 2014; Brower 2012), gözlenen 1,1–2,5 → %2,0 (güç eğrisi sapması, yüksek rüzgâr histerezisi, yaw hatası dahil); çevresel bozunma (kirlenme/erozyon) 1,0 (AWS 2014, 0,6–1,3), 'endüstri standardı 1–2' (Clifton vd. 2016) → %1,0; sıcaklık kapatması ve yıldırım 0,6 (AWS 2014) → %0,5; buzlanma AWS 2014 Kuzey Amerika tipik 1,0 (0–4,5) — TAHMİN %0,2: Türkiye santrallerinin çoğu kıyı/orta rakımlı, kış sıcaklıkları Kuzey Amerika iç kesimlerinden yüksek (yüksek rakımlı doğu sahalarında daha yüksek olabilir; sınırlama)"
    not: "v2'nin toplu %12 kaybı (iz + kullanılabilirlik + elektrik/diğer) v3'te ayrıştırılır. Atlas kalibrasyonu santrallerin GERÇEK iz ve kısa duruş kayıplarını katsayıya gömer; bu yüzden yeni sahada iz ve kullanılabilirlik göreli uygulanır (çift sayım yok): KF(t) = brüt(K·v) · 0,88 · η_iz(t) / (1 − iz_referansi) · A / kalibrasyon_kullanilabilirligi. Eşdeğer 'diğer kayıp' λ = 1 − 0,88 / ((1 − 0,051) · 0,99) = %6,3 (elektrik + atlasın açıklanmayan ortalama sapması). D1 hipotez testi: iz kaybı atlas artığını açıklamadı (eğim t = 0,55; Balıkesir–Biga iz farkı 0,34 puan, p = 0,70); izden arındırılmış katsayılar birini dışarıda bırak RMSE'sini kötüleştirdi (6,87 → 7,03), göreli düzeltme iyileştirdi (6,87 → 6,77; anlamlı değil). Bu yüzden atlas matrisleri güncellenmedi (atlas_iz_arindirma: false)"
  yerlesim:
    value:
      aktif: true
      atlas_iz_arindirma: false
      iz_modeli: "bastankhah"
      ti: 0.10
      jensen_k: 0.075
      asgari_aralik: {hakim_D: 5.0, dik_D: 3.0}
      duzenli_izgara: {hakim_D: 7.0, dik_D: 4.0}
      aday_alt_bolme: 1
      komsu_yaricap_km: 10.0
      komsu_azami: 150
      komsu_tampon_D: 3.0
      yontem: "sa"
      ga: {nufus: 40, nesil: 120, mutasyon: 0.3, turnuva: 3, elit: 2}
      sa: {adim: 3000, t0_oran: 0.1, sogutma: 0.997, yerel_arama: true, baslangic: 3}
      milp_sure_s: 60
      tam_sure_butcesi_s: 60
    birim: "D: rotor çapı katı; km; s"
    kaynak: "İz modeli: Bastankhah & Porté-Agel (2014) Gauss izi, k* = 0,38·TI + 0,004 (Niayifar & Porté-Agel 2016, Energies 9:741); Jensen/Park k = 0,075 kara (Katić, Højstrup & Jensen 1986, EWEC; WAsP/PyWake kara varsayılanı). TI TAHMİN: kara santrallerinde göbek yüksekliği ortam türbülans yoğunluğu tipik %8–12. Asgari aralık: hâkim yönde 5D, dik yönde 3D (Manwell, McGowan & Rogers 2009 'Wind Energy Explained' 2. bs. §9: 'genelde 5–9D rüzgâr yönünde, 3–5D dik'; Samorani 2013 WFLOP derlemesi). Düzenli ızgara referansı 7D × 4D aynı kaynak aralığının ortası"
    not: "yontem: web uygulamasında seçilen yerleşim yöntemi (karşılaştırma: outputs/v3D/D1_yontem_karsilastirma.csv, gerekçe docs/v3_D_yerlesim_bakim.md §4.5: çok başlangıçlı SA, en iyiye ort. %0,13, ~2 s; MILP 24–60 s ve 6 durumun 4'ünde süre sınırı). Aday konumlar GWA 250 m hücre merkezleri (aday_alt_bolme = 2 → 125 m). Komşu santral türbinleri (OSM) 10 km içinde en yakın 150 türbin; yeni türbinler komşu türbinlere 3D'den yakın konamaz (dışlama katmanı)"
  bakim:
    value:
