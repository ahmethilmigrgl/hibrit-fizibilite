    <rect x="13" y="8" width="6" height="6" rx="1"/>
  </g>
  <rect x="1.5" y="14.2" width="29" height="1.8" rx=".9" fill="currentColor"/>
  </g>
  <text x="44" y="28" font-family="'IBM Plex Sans','Public Sans',system-ui,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.3" fill="currentColor">Eşik</text>
  <text x="44" y="38" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="6.6" letter-spacing="1.4" fill="currentColor" opacity="0.6">HİBRİT SAHA ANALİZİ</text>
